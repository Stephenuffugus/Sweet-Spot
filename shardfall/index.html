<style>
:root{--ui:#e8e2d0;--dim:#8a8578;--acc:#3fc9c1;--bad:#e05555;--gold:#d8a53f;--rare:#e6d34a;--magic:#6f8fe0}

html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;font-family:ui-monospace,Menlo,monospace;color:var(--ui);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:8px 10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:12px}
#hpbar{width:140px;height:10px;background:#222;border:1px solid #444}
#hpfill{height:100%;background:var(--bad);width:100%}
#fuelbar{width:140px;height:5px;background:#222;border:1px solid #444;border-top:0}
#fuelfill{height:100%;background:var(--acc);width:100%}
#focbar{width:140px;height:5px;background:#222;border:1px solid #444;border-top:0}
#focfill{height:100%;background:var(--magic);width:100%}
#xpbar{width:140px;height:3px;background:#222;border:1px solid #444;border-top:0}
#xpfill{height:100%;background:var(--gold);width:0%}
#weight{color:var(--bad);font-size:11px;letter-spacing:1px}
#diss{font-size:11px;letter-spacing:2px}
#stats{margin-top:4px;color:var(--dim)}
#right{text-align:right;pointer-events:auto}
#right button{pointer-events:auto}
.hbtn{background:#1a1a22;border:1px solid #444;color:var(--ui);font:inherit;font-size:11px;padding:4px 8px;margin-left:4px}
/* Thumb layout (DESIGN-PLAN §7). Right-thumb pivot is the bottom-right corner, so the most
   used button (MEL) sits closest and ABIL — now gated by Focus, so it's a deliberate press —
   sits furthest. ABIL used to be a full-width bar across the play area. */
#btns{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0) + 12px);display:grid;grid-template-columns:62px 62px;grid-template-rows:52px 62px 62px;gap:9px;align-items:end}
.tb{width:62px;height:62px;border-radius:50%;background:#1a1a22cc;border:2px solid #555;color:var(--ui);font:inherit;font-size:11px;display:flex;align-items:center;justify-content:center;position:relative}
.tb:active{background:#2a2a38}
#bAbil{grid-column:2;width:52px;height:52px;font-size:10px;justify-self:end;border-color:#6f8fe0}
#bAbil.rdy{border-color:var(--acc);box-shadow:0 0 10px #3fc9c155}
#bAbil.cold{opacity:.45}
#bJump{grid-column:1;grid-row:2}#bRng{grid-column:2;grid-row:2}
#bDodge{grid-column:1;grid-row:3}#bMel{grid-column:2;grid-row:3}
#stickzone{position:fixed;left:0;bottom:0;width:45vw;height:55vh}
#stick{position:fixed;width:90px;height:90px;border:2px solid #555;border-radius:50%;background:#1a1a2255;display:none;pointer-events:none}
#nub{position:absolute;width:36px;height:36px;border-radius:50%;background:#555;left:25px;top:25px}
#overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
#panel{background:#12121a;border:1px solid #444;max-width:420px;width:92vw;max-height:80vh;overflow-y:auto;padding:14px;font-size:13px;line-height:1.5}
#panel h2{margin:0 0 8px;font-size:15px;color:var(--acc)}
#panel .title{font-size:30px;letter-spacing:5px;color:var(--acc);text-align:center;margin:6px 0 2px;
 text-shadow:0 0 18px #3fc9c155}
#panel .tagline{text-align:center;margin:0 0 12px;font-style:italic}
/* On the title screen there is no run yet, so a health bar and a minimap of somewhere you
   have not been are pure noise. */
body.titlemode #hud,body.titlemode #btns,body.titlemode #toast{display:none}
#panel button{display:block;width:100%;text-align:left;background:#1a1a24;border:1px solid #3a3a48;color:var(--ui);font:inherit;font-size:12px;padding:8px;margin:5px 0}
#panel button:disabled{opacity:.4}
#panel .row{display:flex;gap:6px}
#panel .row button{flex:1}
.r0{color:var(--ui)}.r1{color:var(--magic)}.r2{color:var(--rare)}.r3{color:var(--gold)}
.sub{color:var(--dim);font-size:11px}
/* socket screen (DESIGN-PLAN §7): sockets as colored circles, live DPS readout */
#panel .dps{background:#0d0d14;border:1px solid #2a2a36;padding:6px 8px;margin:0 0 8px;font-size:11px;color:var(--dim)}
#panel .dps b{color:var(--acc);font-size:12px}
#panel .socks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
#panel .sk{display:flex;align-items:center;gap:4px;background:#0f0f16;border:1px solid #2a2a36;padding:3px 6px;font-size:10px}
#panel .sk i{width:11px;height:11px;border-radius:50%;border:2px solid;display:inline-block;font-style:normal;line-height:8px;text-align:center;font-size:8px;color:#0a0a0f}
#panel .sk .gn{color:var(--ui)}
#panel .sk .gn b{color:var(--gold)}
/* Loot comparison. "Is this better than what I'm wearing" should never require equipping it. */
#panel .cmp{display:block;font-size:10.5px;margin-top:3px}
#panel .cmp .up{color:#6ad07a;margin-right:7px}
#panel .cmp .dn{color:#e07070;margin-right:7px}
#panel button.slotb{padding:8px}
#panel table.sum{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 8px}
#panel table.sum td{padding:3px 0;border-bottom:1px solid #22222c}
#panel table.sum td:first-child{color:var(--dim);width:45%}
/* Lore is the one place in this UI that gets to breathe. */
#panel .lore{font-size:12.5px;line-height:1.65;color:#cfc9b8;margin:2px 0 10px;
 border-left:2px solid #2f2f3c;padding:2px 0 2px 10px}
/* the lattice: the seed is an object in the fiction, so it is typeset like one */
#panel .strand{font-weight:600}
#panel .glyph{float:right;letter-spacing:3px;font-size:13px}
#panel .dissw{position:relative;height:16px;background:#0d0d14;border:1px solid #2a2a36;margin:8px 0 4px}
#panel .dissb{height:100%;background:linear-gradient(90deg,#3fc9c1,#d8a53f 55%,#e05555);transition:width .3s}
#panel .dissl{position:absolute;inset:0;text-align:center;font-size:10px;line-height:16px;letter-spacing:2px;color:#fff;text-shadow:0 0 3px #000}
#panel .graftbuf{font-size:26px;letter-spacing:8px;text-align:center;color:var(--gold);margin:10px 0;
 background:#0d0d14;border:1px solid #2a2a36;padding:8px}
#panel .glyphgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:6px 0}
#panel button.gk{display:block;width:auto;margin:0;padding:7px 0;text-align:center;font-size:13px}
#panel button.escape{border-color:var(--gold);color:var(--gold);background:#241d10}
#panel .mapwrap{background:#07070c;border:1px solid #2a2a36;padding:4px;margin:4px 0}
#panel .bigmap{display:block;width:100%;height:auto;image-rendering:pixelated}
/* Controller/keyboard focus cursor. Every panel is a stack of buttons, so one highlighted
   row is all the UI needs to become fully navigable without a pointer. */
#panel button.foc{border-color:var(--acc);background:#1e2630;box-shadow:inset 3px 0 0 var(--acc)}
#panel button.foc::after{content:'';}
/* Touch controls only exist in touch mode — on a desktop they were dead weight over the
   play area, and on a controller they are worse than dead weight. */
#btns,#stickzone,#stick{display:none}
body.touchmode #btns{display:grid}
body.touchmode #stickzone{display:block}
body.touchmode #bAbil{grid-column:2}
canvas{cursor:none}
body.touchmode canvas{cursor:auto}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#12121add;border:1px solid #444;padding:6px 12px;font-size:12px;display:none;pointer-events:none;white-space:nowrap}

<script>
'use strict';
// ============ CONSTANTS ============
const TILE=16, CHUNK=48, WORLD_W=1600, WORLD_H=3200, SURFACE=60;
const GRAV=1500, MOVE=170, JUMPV=430, DT=1/60;
const MELEE_STEP=8;   // px folded into every committed melee swing — root motion, not the Lunge gem's dash
// --- traversal tuning (Noita-flavored: everyone can fly a little, fuel is the limit) ---
const FLY_THRUST=2100;   // upward accel while hovering (must EXCEED gravity or you only slow the fall)
const FLY_DRAIN=42;      // fuel/sec while thrusting
const FLY_REGEN=58;      // fuel/sec while grounded
const FLY_REGEN_AIR=8;   // trickle while airborne and not thrusting
const FLY_VMAX=-190;     // hover rise cap — a jetpack, not a rocket
const FALL_SAFE=520;     // px/s landing speed below which falling is free
const FALL_DMG=0.11;     // hp per px/s over the safe threshold
const CAMP_X=Math.floor(WORLD_W/2); // camp centered on surface
// --- stat model (DESIGN-PLAN §1) ---
const CRIT_BASE=0.05;    // 5% base crit chance
const CRIT_MULT=1.8;     // base crit multiplier
const CRIT_ST=1.5;       // crits apply status at 1.5x potency — crit and ailment builds overlap
// Crit multiplier is ADDITIVE and softly capped. D4 moved crit out of the multiplicative bucket
// for exactly this reason: unbounded crit damage is the single biggest damage-soup vector, and it
// makes every other offensive stat a rounding error once it snowballs (PLAN §4.4).
// The additive pool is fed by gear affixes, the meta tree, class passives, shrine boons AND
// in-run attunements. With 12 affixes x 15 tree nodes x 12 boons x 22 attunements all pouring
// into one number, the honest question is not whether it runs away but when. It softens past
// +300% so stacking is always worth something and never worth everything.
const INC_SOFT=3.0, INC_SOFT_RATE=0.35;
const CRIT_SOFT=4.0;     // beyond this multiplier, further crit damage is worth a quarter
const CRIT_SOFT_RATE=0.25;
const ARMOR_FLOOR=1;     // armor can never reduce a hit below this
// ...and never below this FRACTION of the incoming hit. Unbounded flat subtraction against
// depth-scaled damage inverts at depth — armour stacking becomes either useless or total. A hit
// always lands for at least 15%, so armour is a strong-vs-swarms stat and never an off switch.
const ARMOR_MIN_FRAC=0.22;
const STACK_MAX=3;       // burn/bleed stack up to 3 instances; chill/shock stay max-only
// The tell must be longer than a human takes to see it. 250ms is the accepted floor for a simple
// visual reaction; everything windup-related clamps to this AFTER every multiplier (PLAN §Sprint 0.4).
const WINDUP_FLOOR=0.26;
// After the strike lands the enemy is open. `tell -> punish -> reset` is the whole loop; without
// the third beat there is no window to punish INTO, and combat is just "wait, then hit" (Sprint 0.5).
const RECOVER_DMG=1.25;  // damage multiplier while an enemy is recovering
// --- Focus: the ability resource (DESIGN-PLAN §3.2) ---
const FOCUS_MAX=100, FOCUS_HIT=8, FOCUS_KILL=25, FOCUS_REGEN=2;
// --- The Weight: anti-camping pressure (DESIGN-PLAN §3.4.2) ---
const WEIGHT_EVERY=18, WEIGHT_GRACE=90, WEIGHT_MAX=10;

// ============ DATA TABLES (append content here — everything is data-driven) ============
// ============ SPRITES ============
// Real pixel art with no asset files and no build step: each sprite is a grid of characters,
// one string per row, each character indexing a palette ramp. Baked ONCE into an offscreen
// canvas at load, blitted thereafter — so the runtime cost is the same drawImage the flat
// fillRect version cost, and adding a creature is still a table entry (CLAUDE.md rule 4).
//
// RAMPS run light -> dark. Hue rotates warm-to-cool as value drops, which is what stops a ramp
// reading as one colour at five brightnesses. Light comes from the TOP-LEFT in every sprite.
const RAMPS={
 stone: ['#9aa3b0','#6f7889','#4e5666','#353b47','#22262e'],
 dirt:  ['#b08a5e','#8a6743','#654a30','#46331f','#2b1f13'],
 flesh: ['#d98d6a','#b06a4c','#854b34','#5c3323','#382016'],
 fungal:['#c39ae0','#9a72bd','#71508f','#4d3563','#2f2040'],
 forge: ['#f0a05a','#c9743a','#97502a','#66351c','#3d1f10'],
 void:  ['#a89af0','#7c6cc9','#574a97','#383066','#211c3d'],
 bone:  ['#bfb595','#9c9276','#746b55','#4f4839','#2e2a21'],
 rot:   ['#a8c07a','#7f9455','#5c6b3b','#3e4726','#252b15'],
 // RESERVED — the player only. Nothing else may use this ramp, which is the whole reason the
 // eye finds you instantly in a dark, busy, destructible world.
 hero:  ['#f4ecd8','#cfc4a8','#a1957a','#6d6350','#3d3830'],
};
const ACC={shard:'#3fc9c1',bright:'#bffffb',gold:'#d8a53f',blood:'#e05555',ember:'#ff8a3f'};
const OUTLINE='#14141c';   // near-black, never pure black — pure black reads as a hole
function palOf(r){const c=RAMPS[r]||RAMPS.stone;
 return {'1':c[0],'2':c[1],'3':c[2],'4':c[3],'5':c[4],'o':OUTLINE,
  'S':ACC.shard,'B':ACC.bright,'G':ACC.gold,'R':ACC.blood,'E':ACC.ember}}
// SILHOUETTE LAW — every family owns a distinct TOP SHAPE and GROUND-CONTACT count, because
// the top two rows and the feet are what the eye resolves first at 16px in the dark.
//   player  single tuft, 2 legs      beast   two horns w/ gap, 4 legs
//   construct flat overhang, 2 blocks swarm  domed, no top feature

// Bake once. Sprites are keyed by (name, frame); a missing sprite silently falls back to the
// flat quad, so the game keeps rendering while the roster is only half drawn.
const BAKED={};
function bakeSprites(){
 for(const name in SPR){const S=SPR[name],pal=palOf(S.r);
  BAKED[name]=S.f.map(rows=>{
   const w=rows[0].length,h=rows.length;
   const c=document.createElement('canvas');c.width=w;c.height=h;
   const g=c.getContext('2d');
   for(let y=0;y<h;y++){const row=rows[y];
    for(let x=0;x<row.length;x++){const ch=row[x];if(ch==='.'||ch===' ')continue;
     const col=pal[ch];if(!col)continue;g.fillStyle=col;g.fillRect(x,y,1,1)}}
   return c})}}

// THE DESCENT ARC. The world used to be one noise field with a density number per band, and the
// measured result was a caves band that was 90% air — an open void, not caves — and then five
// bands of near-identical rubble for 2,800 tiles. There was no shape to feel.
//
// Each band now declares the fraction of itself that is AIR, and the generator solves for the
// threshold that produces it (calibrateAir) instead of hoping a magic number lands. `ax`/`ay`
// stretch the noise so density and CHARACTER are separate knobs: the same 0.42 air reads as
// winding corridors or as vertical shafts depending on which axis is compressed.
//
// The arc is tight -> open -> built -> tight -> vast. Tension and relief alternate, and the last
// band is both the most open and the most dangerous, which is the note to end on.

// scale 'pct' => stored as a percent that folds into the ADDITIVE pool; 'flat' => added raw.
//
// AFFIX TIERS are the spine of the whole item game, and the thing this table did not have. Every
// affix has five tiers; tier T multiplies the base range by grow^(T-1), and an item can only roll
// tiers its ITEM LEVEL allows. That single rule is what makes a 3,000m sword meaningfully better
// than a 100m sword instead of statistically identical to it — which is the entire reason to keep
// looking at loot after the first ten minutes.
const AFF_TIER_ILVL=[1,300,800,1500,2400];   // minimum item level for tiers 1..5

];

// Built step by step rather than by a closed-form power, because rounding a small range (armour
// is 2-9, leech is 2-5) collapsed adjacent tiers onto the same integers — a "Grand" roll that is
// numerically identical to a plain one is worse than having no tiers at all.
function affTierRange(a,t){const g=a[5]||1.3;let lo=a[2],hi=a[3];
 for(let i=1;i<t;i++){lo=Math.max(lo+1,Math.round(lo*g));hi=Math.max(hi+2,Math.round(hi*g))}
 return [lo,hi]}
// The highest tier this item level may roll, and then a weighted draw beneath it — a deep item is
// USUALLY good rather than ALWAYS perfect, which is what keeps the drop worth reading.
function affTierFor(ilvl){
 let max=1;for(let t=0;t<AFF_TIER_ILVL.length;t++)if(ilvl>=AFF_TIER_ILVL[t])max=t+1;
 let t=max;while(t>1&&chance(0.42))t--;
 return t}

//   `bad` names a property that makes this modifier UNFAIR on that creature and bars the roll.
//     Vampiric on a ranged enemy heals it from a distance you cannot punish; Swift on something
//     that already crosses the screen in a lunge is not a modifier, it is a coin flip.
//   Every entry has to change how the fight is PLAYED, not only what the numbers are — an elite
//   that is just "same enemy, bigger" is a health bar with a border.
const ELITES=[
 {id:'swift',   n:'Swift',    c:'#6ad0e0', hp:1.2, dmg:1.1, spd:1.7, bad:'fast'},

 // ---- second wave: modifiers you have to play around rather than out-stat ----
 // Frenzied inverts the usual ending: the fight gets HARDER as you win it, so committing to the
 // kill is a real decision instead of the obvious one.
 {id:'frenzied',n:'Frenzied', c:'#e0a03f', hp:1.6, dmg:1.15,spd:1.0, frenzy:1},
 // Roiling turns the arena against you over time — you cannot kite it in a circle forever.
 {id:'roiling', n:'Roiling',  c:'#8fdc6a', hp:1.8, dmg:1.1, spd:0.95,
   trail:{every:.7,r:24,t:3.5,dmg:.18,st:{bleed:.4},col:'#8fdc6a',kind:'gas'}},
 // Hexing makes it a status problem: chill slows you into the next hit, shock deepens it.
 {id:'hexing',  n:'Hexing',   c:'#c98fe0', hp:1.7, dmg:1.0, spd:1.05, hex:{chill:.6,shock:1.3}},
 // Gilded is the one the PLAYER chooses to take on: much more loot, much more enemy. A risk you
 // can walk away from is worth more than a reward you cannot refuse.

// What one of these is WORTH in an encounter, derived from its own stats rather than hand-kept in
// a parallel table that would drift the moment anything is retuned. `cost` overrides it if a
// creature is worth more than it looks (a support unit is, which is why it carries a surcharge).
function enemyCost(ty){const E=ENEMIES[ty];if(E.cost!==undefined)return E.cost;
 const c=E.hp/40+E.dmg/14+(E.arm||0)/7+(E.shoot?0.8:0)+((E.heal||E.ward)?1.6:0)+(E.pack?E.pack*0.25:0);
 return Math.max(0.5,Math.round(c*10)/10)}
// Elites are rolled from what is FAIR on that creature, not from the whole list.
function eliteFor(E){
 const ok=ELITES.filter(m=>{
  if(m.bad==='ranged'&&E.shoot)return false;      // heals itself out of your reach
  if(m.bad==='fast'&&E.spd>=90)return false;      // already faster than the tell
  if(m.trail&&E.trail)return false;               // two trails is one trail and a frame cost
  return true});
 return ok.length?ok[ri(0,ok.length-1)]:null}

// ============ LORE ============
// The fiction, in one table. Entries unlock by playing: a bestiary page on first kill, an item
// page on first find, a biome page on first descent, and fragments that drop in the world.
// Nothing here is required reading — it is all opt-in through the codex — but it is the reason
// the currency is called shards and the reason the world resents you for lingering.
const LORE={
 world:{
  n:'The Shardfall',
  d:`Something fell. Not a star — stars burn out politely, at a distance. This came down whole
and kept going, and the ground closed over it like water over a stone.

That was nine hundred years ago, and the hole is still open.

What we mine down there is not ore. Shards are pieces of the thing itself, and they are warm,
and they hold a charge, and if you set two of them in the same socket they argue. Every lamp in
the camp, every gem in your axe, every road east of here runs on the shattered body of whatever
it was we killed by catching it.

We call ourselves delvers, which is a polite word for what we do.`},
 biome:{
  surface:{n:'The Rim',d:`Grass grew back over the impact within a generation, which everyone
took as forgiveness. The camp sits on the lip because nobody has ever found a reason to build
further in, and several reasons not to.

Look down the shaft at night and you can see the glow. It has not dimmed in nine centuries.`},
  caves:{n:'The Caves',d:`Not caves. Cracks — the shape the bedrock made getting out of the way,
still holding that shape long after the thing that pushed it stopped moving.

The first two hundred metres are picked clean and safe, which is why most delvers die at three
hundred. The crawlers down here are the ones that learned to wait.`},
  fungal:{n:'The Bloom',d:`Fungus grows where shard-light reaches and nothing else does. It is
not alive in any way a physician would sign off on: cut it and it flinches, burn it and the
spores in the next chamber flinch too.

The sporemother is what happens when a colony gets old enough to have opinions. She does not
hunt. She simply grows in the direction of the noise.`},
  ruins:{n:'The Ruins',d:`Someone was down here first.

The brickwork is older than the fall — which is not possible, and has been reconfirmed by four
separate expeditions, three of which did not come back. The sentinels still patrol corridors to
rooms that no longer exist. They were not built to keep us out. The doors face inward.`},
  forge:{n:'The Forge',d:`The heat has no source. Survey after survey finds no magma, no vent, no
chemistry that would explain it — just rock at a steady seven hundred degrees, and things living
in it that should not be able to.

The forgelord was a delver once. There is a name plate riveted to what used to be its chest,
and the guild has quietly stopped publishing the list of who is missing.`},
  abyss:{n:'The Abyss',d:`Here the rock stops pretending.

There is no ore this deep because there is no stone this deep — only the compacted dark that
sits directly against the thing itself, and the wraiths that pass through it as though it were
a rumour. Voidmaw is not the guardian. Voidmaw is a symptom.

Whatever fell is below this. Nobody has been below this.`},
 },
 // Bestiary. Written from a delver's field notes, because a monster you have been warned about
 // is a different monster.
 enemy:{
  crawler:{n:'Crawler',d:`Six legs, no eyes, follows heat. Harmless in the open and lethal in a
corridor, which describes most of what kills people down here. It telegraphs — they all do —
and delvers who die to crawlers died looking at something else.`},
  bat:{n:'Cave Bat',d:`Roosts in shard-light and dives at movement. Individually trivial.
The problem is that they are never individual.`},
  rockling:{n:'Rockling',d:`Sits still and looks exactly like the wall for as long as it takes.
Ambushes from further away than seems reasonable. The armour is real; the patience is worse.`},
  brute:{n:'Brute',d:`Slow, armoured, and committed. Once it winds up it is going to finish the
swing whether you are still there or not — which is the whole trick to it.`},
  spitter:{n:'Spitter',d:`Keeps its distance and lobs something caustic. Kill it first. Every
veteran says this and every novice learns it anyway.`},
  sporeling:{n:'Sporeling',d:`Dies into a cloud. The cloud is the point; the sporeling is just
the delivery. Do not kill it next to you, and do not kill it next to a door you need.`},
  stalker:{n:'Stalker',d:`Fast, fragile, and it has already decided. Standing still in the Bloom
is a decision you get to make once.`},
  archer:{n:'Ruin Archer',d:`Outranges you. Still guarding a wall that fell down four hundred
years ago, still hitting what it aims at.`},
  shieldman:{n:'Shieldman',d:`Blocks everything from the front and nothing from behind. The
ruins are full of narrow rooms and this is not a coincidence.`},
  ember:{n:'Ember',d:`Runs at you and detonates. It is not a suicide attack — the ember does not
consider itself to have died. Something down here keeps making more.`},
  smith:{n:'Smith',d:`Huge, armoured, unhurried, and it throws fire. The name is a guess. It has
hands and it uses them on something out of sight, and nobody has stayed long enough to see what.`},
  wraith:{n:'Wraith',d:`Goes through the rock. There is no wall you can put between yourself and
the Abyss, and the wraith is how the Abyss makes that point.`},
  voidspawn:{n:'Void Spawn',d:`Splits when killed. Kill it in the open. Kill it early. Do not
kill it in a dead end, and do not kill three at once because you were in a hurry.`},
  voidling:{n:'Voidling',d:`The halves. Faster, angrier, and there are now two problems.`},
  delvemite:{n:'Delvemite',d:`One of them is a nuisance. There is never one of them.

They nest in the old spoil heaps and they have no interest in you at all until the moment they
collectively do, which is a distinction that has never once helped anybody.`},
  burrower:{n:'Burrower',d:`It does not go around the rock and it does not go through the rock in
the way a wraith does. It eats the rock, and the hole stays.

Every veteran has a story about being saved by a tunnel a burrower dug. Every one of those
stories starts with a burrower.`},
  bloomback:{n:'Bloomback',d:`Slow enough to walk away from and heavy enough that you will want
to. The cap is not armour, it is a seedbed, and it sheds the whole way.

The ground behind it is not safe for a while. Neither is the ground in front of it, but that is
at least an honest problem.`},
  chanter:{n:'Chanter',d:`Stands at the back and puts the others back together. It has no weapon
worth the name and it is the most dangerous thing in the room.

Kill the chanter. This is the entire lesson of the ruins and it costs most people a run to learn.`},
  warder:{n:'Warder',d:`A ruin-machine still running a four-hundred-year-old order to protect
whatever stands near it. It does not care that what stands near it is now a brute.

The light it throws is the shield. Put the light out.`},
  mortar:{n:'Mortar',d:`It does not aim at you. It aims at the floor you happen to be standing
on, which is a different problem and a worse one, because you are usually still there.

The circle on the ground is a courtesy. Take it.`},
  hollowed:{n:'Hollowed',d:`Delver-shaped, delver-sized, and empty through the middle. Nobody
likes to say what that means and everybody has thought it.

It hits like the rock it came out of. It is in no hurry.`},
  warden:{n:'The Warden',d:`First thing down here big enough to have a name.

It stands in a room it carved itself and it does not leave, which suggests it is guarding
something, which suggests the caves are a door. Nobody has found what it opens onto.`,boss:1},
  sporemother:{n:'The Sporemother',d:`A colony that got old. She does not chase; she simply
grows toward the noise you are making, and the Bloom grows with her.

Burn her and the whole chamber burns. This is usually a mistake.`,boss:1},
  sentinel:{n:'The Sentinel',d:`Still on duty. Its armour bears a maker's mark that predates the
fall by an amount the guild refuses to print, and it fights like something that has done this
many times and expects to again.

It does not pursue past the threshold of its room. Whatever it was told to hold, it is holding.`,boss:1},
  forgelord:{n:'The Forgelord',d:`There is a name plate. It reads like a person's name.

Every delver who gets this deep goes quiet for a while afterward, and then most of them stop
going down. The ones who keep going are the ones this game is actually about.`,boss:1},
  voidmaw:{n:'Voidmaw',d:`Not a guardian. A symptom.

It phases, it chills, it comes apart and reassembles slightly wrong, and it is the last thing
between a delver and whatever is actually down there. Killing it does not open anything.
It just means you get to keep going.`,boss:1},

  {id:'f13',depth:3050,n:'Last page',d:`The shards are warm because they are still connected.

  {id:'escape',depth:-1,n:'What you wrote',d:`You reached the bottom, which does not exist,
and found it was not a floor but a surface — the outside of the thing, seen from inside.

So you did the only thing left. You took the master glyph, six symbols long, and you wrote a
different one, and reality did what reality does when something with enough of its substance in
its hands tells it to be otherwise.

It agreed.

The camp is where it was. The shaft is where it was. Everything you carried down is still in
your hands and the depth is wrong by a few hundred metres in a direction that does not have a
name yet.

Nine hundred years of us cutting pieces off it and carrying them into the light, and it turns
out the pieces were the point. Not the shards. Us. We were the part that got planted.

You have escaped exactly as far as the inside of a thing that is still growing.

  reroll:`You are holding a piece of the thing that decides what is under the rock.

Break it and that part of the world stops being what it was and becomes something else. Not a
different room. A different set of rooms that were always there instead.

You will want to do this the moment a descent goes badly. Everyone does. That is not a flaw in
you — it is the oldest thing a person does when the world is not the one they wanted.

The world does not object. It simply begins to keep count.`,
  lock:`The opposite instinct, and the rarer one.

Bind a strand and no unmaking can touch it. What you have learned stays learned; the caves you

  echo:`Every strand you have ever rewritten leaves a residue, and the residue keeps its shape.

  invert:`The same world, reflected.

Every wall becomes the space beside it. Every seam you memorised is still there, on the other

The thing that fell does not seem to mind being mirrored. Make of that what you like.`,

Six glyphs, written by hand, and the rock agrees to them. This is what every delver actually

vandalism. Grafting is authorship, and the world can tell the difference.`,

// ============ THE LATTICE — SIGILS, DISSONANCE, ESCAPE ============
// The mechanic this whole game is pointed at.
//
// Roguelite players seed-scum. They read the seed, look it up, restart until the world is
// favourable. Shardfall's answer is not to prevent that — it is to make it the text. You are
// mining the thing that generates reality. Of course you can eventually edit it. And of course
// it notices.
//
// SIGILS are the verbs. Each edits one strand of the world seed. They are found deep, they are
// consumed on use, and every use raises DISSONANCE — the world's awareness that it is being
// rewritten. Dissonance is a resource you spend against yourself: it makes the world hostile in
// escalating, legible ways, and past a threshold it is the only thing thin enough to escape
// through. You cannot leave a world you have not damaged.
const SIGILS_DEF={
 reroll:{n:'Sigil of Unmaking', d:'reroll one strand — that part of the world becomes another world',
   diss:14, col:'#e05555'},
 lock:  {n:'Sigil of Binding',  d:'lock one strand — no later reroll may touch it',
   diss:6,  col:'#6ad07a'},
 echo:  {n:'Sigil of Echo',     d:'restore one strand to the value it had on a past run',
   diss:10, col:'#6f8fe0'},
 invert:{n:'Sigil of Inversion',d:'mirror one strand — the same world, reflected',
   diss:12, col:'#c39ae0'},
 graft: {n:'Sigil of Grafting', d:'write one strand to a glyph you name',
   diss:22, col:'#d8a53f'},
};
// What Dissonance does, in ascending order. Each stage is a stated rule so the player can
// reason about it — an escalation you cannot predict is just noise.
const DISS_STAGES=[
 {at:0,   n:'Quiet',      d:'The world has not noticed.'},
 {at:20,  n:'Stirring',   d:'Enemies find you faster. Something is paying attention.'},
 {at:45,  n:'Bleeding',   d:'Creatures from other depths appear where they should not.'},
 {at:70,  n:'Unstable',   d:'The rock forgets its shape. Chunks re-form as you pass.'},
 {at:100, n:'Unwritten',  d:'It knows your name now. The way out is open.'},
];
let DISSONANCE=0, SIGILS=[], WOVEN=0;   // WOVEN = strands edited this run
function dissStage(){let s=DISS_STAGES[0];for(const d of DISS_STAGES)if(DISSONANCE>=d.at)s=d;return s}
function dissIdx(){let i=0;DISS_STAGES.forEach((d,k)=>{if(DISSONANCE>=d.at)i=k});return i}
// Rewriting a strand invalidates every chunk that strand touches. Terrain and boss arenas are
// structural, so the whole world below is dropped; the rest only needs the spawn bookkeeping
// cleared. Chunks the player is standing in are kept, or the ground vanishes underfoot.
function reweave(strand,newSeed){
 WEAVE[strand]=newSeed>>>0;
 WOVEN++;bTick('weave');
 // The band thresholds are derived FROM the terrain strand, so rewriting it must re-solve
 // them or the new world is generated against the old world's shape.
 if(strand==='terrain')calibrateAir();
 const pcx=Math.floor(P.x/TILE/CHUNK), pcy=Math.floor(P.y/TILE/CHUNK);
 const structural=(strand==='terrain'||strand==='boss');
 for(const [k,c] of CHUNKS){
  const i=k.indexOf(','), cx=+k.slice(0,i), cy=+k.slice(i+1);
  if(Math.abs(cx-pcx)<=1&&Math.abs(cy-pcy)<=1)continue;   // never dissolve the floor you're on
  if(structural)CHUNKS.delete(k);
  else{c.spawned=false;c.spawns=genChunk(cx,cy).spawns;c.dirty=true}}
 // POIs and sleeping enemies belonging to dropped chunks go with them.
 if(strand==='poi'){CHESTS.length=0;SHRINES.length=0}
 if(strand==='terrain')VENTS.length=0;   // vents are part of the shape, and the shape just changed
 if(strand==='spawn'||strand==='boss'){
  for(let i=EN.length-1;i>=0;i--){const e=EN[i];
   if(Math.hypot(e.x-P.x,e.y-P.y)>420)EN.splice(i,1)}}
 addShake(10);flash(0.3);sfx('shatter');rumble(0.8,0.6,300);
 MM=null;   // the minimap is a memory of a world that no longer exists
 return true}
function addDissonance(n){
 const before=dissIdx();
 DISSONANCE=Math.min(140,DISSONANCE+n);
 const after=dissIdx();
 if(after>before){const st=DISS_STAGES[after];
  toastQ(st.n.toUpperCase());toast(st.d);flash(0.4);addShake(12);sfx('die');
  discover('diss',st.n,true)}}
// Dissonance leaks into the world through three specific, stated channels.
function dissSpeed(){return 1+Math.min(0.5,DISSONANCE/200)}       // Stirring: enemies close faster
function dissBleed(){return DISSONANCE>=45?Math.min(0.45,(DISSONANCE-45)/160):0}  // Bleeding: wrong-biome spawns
function dissChurn(){return DISSONANCE>=70?Math.min(0.6,(DISSONANCE-70)/120):0}   // Unstable: chunks re-form
function canEscape(){return DISSONANCE>=100&&(META.bosses?Object.keys(META.bosses).length:0)>=3}

 for(let i=0;i<n;i++){const E=ECHOES[i%ECHOES.length];
  for(const k in E){if(k==='n'||k==='d')continue;

// ============ RNG + NOISE + THE LATTICE ============
// The world is not generated from one seed. It is generated from SIX — one per STRAND — and
// the whole late game is about editing them.
//
// This is not an implementation detail dressed as a mechanic. It is the fiction: the thing
// that fell is what generates the world, shards are fragments of its entropy, and nine hundred
// years of mining it is nine hundred years of pulling randomness out of reality. A delver deep
// enough finds SIGILS that can rewrite a strand — and the only way out of a world with no
// bottom is to overwrite the master seed and have reality re-form around you.
//
// Splitting the seed is what makes that legible. Reroll `poi` and every chest moves while the
// caves stay exactly as you learned them. Lock `terrain` and reroll everything else. The
// player can SEE which part of reality they are editing, which is the difference between a
// mechanic and a cheat code.
let SEED=Date.now()>>>0;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const rr=(a,b)=>a+RNG()*(b-a), ri=(a,b)=>Math.floor(rr(a,b+1)), chance=p=>RNG()<p;

// The six strands, in the order the codex lists them.
const STRANDS=[
 {k:'terrain',n:'Shape',   d:'the rock itself — caves, cliffs, the way down'},
 {k:'ore',    n:'Seam',    d:'where the shards lie'},
 {k:'poi',    n:'Cache',   d:'chests, shrines, vaults, the secret places'},
 {k:'spawn',  n:'Swarm',   d:'what lives here, and where it waits'},
 {k:'boss',   n:'Warden',  d:'the arenas, and what stands in them'},
 {k:'flux',   n:'Drift',   d:'the small variances — texture, scatter, chance'},
];
// WEAVE holds one 32-bit seed per strand, derived from the master seed at run start.
let WEAVE={}, WEAVE_LOCK={};
function deriveWeave(master){

 STRANDS.forEach((s,i)=>{
  // Each strand is a different mixing of the master, so two strands never move together.
  WEAVE[s.k]=(Math.imul(master^Math.imul(i+1,0x9E3779B9),2654435761)^(master>>>(i+3)))>>>0});

// A short human-readable glyph for a strand seed. This string is shown in the UI and is the
// thing a player will screenshot, compare and eventually type — so it has to be short and
// unambiguous. 8 symbols from a 32-glyph alphabet = 40 bits of address space displayed.
const GLYPHS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function seedGlyph(v){let out='',x=v>>>0;
 for(let i=0;i<6;i++){out+=GLYPHS[x&31];x=x>>>5}
 return out}
function glyphSeed(g){let v=0;g=String(g).toUpperCase().replace(/[^A-Z2-9]/g,'');
 for(let i=Math.min(5,g.length-1);i>=0;i--){const d=GLYPHS.indexOf(g[i]);if(d<0)continue;v=(v<<5)|d}

// Per-strand spatial hash. Everything in world generation reads through this, so a strand's
// seed is the only thing that decides what that strand produces.
function hashS(strand,x,y){

function hash2(x,y){return hashS('terrain',x,y)}
function smooth(t){return t*t*(3-2*t)}

// its own frequency and taking the quantile. Hand-tuned thresholds cannot survive a change to the

// ============ UI: PANELS / TOAST ============
const $=id=>document.getElementById(id);
let MODAL=false;
// UIROOT is the screen that BACK and cancel return to: 'title' before a run has started,
// 'pause' inside one, null for a panel opened straight from gameplay. Without it, any
// sub-screen reached from the title (codex, settings, controls) cleared the modal flag and
// made the title itself dismissible.
let UIROOT=null;
// `fn` is the function that produced this panel, kept so the screen can be redrawn in place
// when the input device changes and every prompt on it becomes wrong.
let PANEL_FN=null;
// Death outranks every other modal. A shrine, a level-up or a fragment opening in the same
// frame as death used to replace the YOU DIED panel — and satisfying that modal left the game
// paused, dead, with no way to start a new run.
let PANEL_Q=[];
function openPanel(html,modal,fn){
 if(P.dead&&!DYING)return;
 // A second modal raised in the SAME FRAME queues instead of replacing the first. One swing
 // can kill an enemy (level-up) and crack a chest (fragment) at once, and the fragment used to
 // silently eat the level-up panel — leaving P.picks above zero with no UI to spend it in.
 if(MODAL&&modal&&!DYING){PANEL_Q.push([html,modal,fn||null]);return}
 MODAL=!!modal;PANEL_FN=fn||null;
 $('panel').innerHTML=html;$('overlay').style.display='flex';paused=true;
 menuIdx=0;menuFocus(0)}
function backPanel(){
 if(UIROOT==='title')return openTitle();
 // PANEL_FN===openPause means the pause screen ITSELF is what's on display, so backing out of
 // it must resume — not re-open it. Sub-panels carry their own fn and still return to pause.
 if(UIROOT==='pause')return PANEL_FN===openPause?closePanel():openPause();
 closePanel()}
// A modal panel demands a choice. Dismissing the death screen used to hide the overlay while
// leaving paused=true — the game was still running nothing, with no way back.
function closePanel(force){if(MODAL&&!force)return;
 // Closing anything opened from the title returns to the title. Letting it fall through would
 // start the run with the HUD still hidden and no descent ever chosen.
 if(UIROOT==='title'&&!force)return openTitle();
 // UIROOT is cleared on the branch that actually tears the panel down. The title and modal
 // cases both return above this line, so neither is affected.
 MODAL=false;PANEL_FN=null;UIROOT=null;$('overlay').style.display='none';if(!P.dead)paused=false;
 if(PANEL_Q.length&&!P.dead){const q=PANEL_Q.shift();openPanel(q[0],q[1],q[2])}}
let toastT=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',1600)}
$('overlay').addEventListener('pointerdown',e=>{if(e.target===$('overlay')&&!MODAL&&!P.dead)closePanel()});

// -------- inventory / equip / socket --------
// A snapshot of everything a piece of gear can move, so a bag item can be compared against
// what you are wearing without the player having to equip it and equip it back.
function statSnap(){
 return {m:dpsOf(ATK.melee),r:dpsOf(ATK.ranged),hp:maxHP(),arm:armorVal(),
         crit:Math.round(critChance()*100),fuel:maxFuel()}}
function slotFor(it){const b=GEAR[it.base];
 if(b.slot!=='any')return b.slot;
 return EQ.melee&&GEAR[EQ.melee.base].shield?'ranged':'melee'}
// Swaps the item in, measures, and swaps back. Cheap because it only runs when a panel draws.
function compareTo(it){
 const slot=slotFor(it),cur=EQ[slot];
 const before=statSnap();
 EQ[slot]=it;refreshAttacks();
 const after=statSnap();
 EQ[slot]=cur;refreshAttacks();
 const parts=[];
 const add=(label,a,b,unit)=>{const d=Math.round(b-a);if(!d)return;
  parts.push(`<span class="${d>0?'up':'dn'}">${d>0?'+':''}${d}${unit||''} ${label}</span>`)};
 add('melee',before.m,after.m);add('ranged',before.r,after.r);
 add('hp',before.hp,after.hp);add('armor',before.arm,after.arm);
 add('crit',before.crit,after.crit,'%');add('fuel',before.fuel,after.fuel);
 return parts.length?parts.join(' '):'<span class="sub">no change</span>'}

// The socket screen is the most-used screen in the game (DESIGN-PLAN §7). Item at the top,
// sockets as colored circles, a live DPS line, gem list below, two-tap to place.
function dpsLine(){
 const m=dpsOf(ATK.melee),r=dpsOf(ATK.ranged);

 return '<div class="socks">'+it.sockets.map((g,i)=>{
  const c=sockColOf(it,i),col=c==='*'?'#e8e2d0':SOCK[c].c;
  const gid=gemId(g),G=gid?GEMS[gid]:null;
  const t=gemTier(g);
  const inner=G?`<span class="gn">${G.n}${t>1?' <b>T'+t+'</b>':''}</span>`:'<span class="gn sub">empty</span>';
  return `<div class="sk"${clickable?` onclick="unsocket('${slot}',${i})"`:''}>
    <i style="border-color:${col};background:${G?col:'transparent'}">${c==='*'?'◇':''}</i>${inner}</div>`}).join('')+'</div>'}
function openBag(){
 let h='<h2>BAG</h2>'+dpsLine();
 for(const s of ['melee','ranged','armor']){const it=EQ[s];
  if(!it){h+=`<button class="slotb" disabled>${s.toUpperCase()}: —</button>`;continue}
  h+=`<button class="slotb" onclick="itemMenu('${s}')">${s.toUpperCase()}: <span class="r${it.rarity}">${itemName(it)}</span> ${ilvlStr(it)}

  if(b.kind==='gear')h+=`<button onclick="equipFromBag(${i})"><span class="r${b.item.rarity}">${itemName(b.item)}</span> ${ilvlStr(b.item)}${bagBetter(b.item)}

   h+=`<button onclick="socketGem(${i})"><span style="color:${col}">◆</span> ${G.n}${(b.tier||1)>1?' T'+b.tier:''}

function placeShield(i,slot){swapIn(i,slot)}
function swapIn(i,slot){const b=BAG.splice(i,1)[0];

// Socket colors are the crafting tension: the gem you want may have nowhere to go (§3.1).
function socketGem(i){const b=BAG[i],G=GEMS[b.id];
 let h=`<h2><span style="color:${SOCK[G.col||'r'].c}">◆</span> ${G.n}</h2>
  <div class="sub">${G.t} · needs a <b style="color:${SOCK[G.col||'r'].c}">${SOCK[G.col||'r'].n}</b> socket · ${G.d||''}</div>`;

  const open=it.sockets.map((g,ix)=>g?-1:ix).filter(ix=>ix>=0);

 // Fusion: three identical gems of the same tier become one of the next tier (§3.3).

  h+=`<button ${META.shards<cost?'disabled':''} onclick="fuseGem('${b.id}',${b.tier||1})">

function placeGem(i,slot,idx){const b=BAG[i];const it=EQ[slot];

// GEM FUSION — the infinite shard sink. Duplicate gems stop being disappointing.
function fuseGem(id,tier){
 const cost=tier===1?150:500;
 if(META.shards<cost)return;
 let removed=0;
 for(let i=BAG.length-1;i>=0&&removed<3;i--){const x=BAG[i];
  if(x.kind==='gem'&&x.id===id&&(x.tier||1)===tier){BAG.splice(i,1);removed++}}

  <div class="sub">Master glyph <b class="r3">${seedGlyph(SEED)}</b> · ${SIGILS.length} sigil${SIGILS.length===1?'':'s'} carried · ${WOVEN} strand${WOVEN===1?'':'s'} rewritten this descent</div>
  ${dissBar()}`;
 h+='<div class="sub" style="margin-top:10px">STRANDS</div>';
 for(const st of STRANDS){
  const locked=WEAVE_LOCK[st.k];
  h+=`<button ${SIGILS.length?'':'disabled'} onclick="latPick('${st.k}')">
   <span class="strand">${locked?'&#9632;':'&#9633;'} ${st.n}</span>
   <span class="glyph r3">${seedGlyph(WEAVE[st.k])}</span>
   <span class="sub"><br>${st.d}${locked?' — <b>bound</b>':''}</span></button>`}

// -------- full map --------
// The corner minimap is for moment-to-moment orientation. This is for deciding where to go:
// same fog-of-war rules, four times the reach, and every POI you have found marked on it.
function openMap(){
 // Separate x and y steps: the world is 1600 tiles wide and 3200 deep, so one step for both
 // wastes half the map on empty space past the world edge. This shows the whole shaft.
 const W=280,H=340,SX=6,SY=10;
 // World-aligned sampling lattice — see drawMinimap for why (ore dots swam as you moved).
 const ptx=Math.floor(P.x/TILE/SX)*SX,pty=Math.floor(P.y/TILE/SY)*SY;
 const c=document.createElement('canvas');c.width=W;c.height=H;
 const g=c.getContext('2d');
 g.fillStyle='#07070c';g.fillRect(0,0,W,H);
 for(let my=0;my<H;my++)for(let mx=0;mx<W;mx++){
  const tx=ptx+(mx-W/2)*SX,ty=pty+(my-H/2)*SY;
  if(tx<0||ty<0||tx>=WORLD_W||ty>=WORLD_H)continue;
  // Same rule as the minimap: never getTile() here, it would generate world from a UI draw.
  const ch=CHUNKS.get(chunkKey(Math.floor(tx/CHUNK),Math.floor(ty/CHUNK)));
  if(!ch)continue;
  const v=ch.tiles[(ty%CHUNK)*CHUNK+(tx%CHUNK)];if(v===0)continue;
  const T=TILES[v];
  g.fillStyle=(T.ore||T.secret)?'#3fc9c1':T.c;g.fillRect(mx,my,1,1)}
 const mark=(wx,wy,col,sz)=>{const mx=(wx/TILE-ptx)/SX+W/2,my=(wy/TILE-pty)/SY+H/2;
  if(mx>1&&mx<W-1&&my>1&&my<H-1){g.fillStyle=col;g.fillRect(mx-sz/2,my-sz/2,sz,sz)}};
 for(const ch of CHESTS)if(!ch.opened)mark(ch.x,ch.y,'#d8a53f',3);
 for(const sh of SHRINES)if(!sh.used)mark(sh.x,sh.y,'#ffe9a0',3);
 for(const e of EN)if(e.boss)mark(e.x,e.y,'#e05555',5);
 if(ANCHOR)mark(ANCHOR.x,ANCHOR.y,'#3fc9c1',5);
 mark(CAMP_X*TILE,surfH(CAMP_X)*TILE,'#d8a53f',5);
 // world edges, so the shaft reads as a place with sides rather than an infinite void
 const ex0=(0-ptx)/SX+W/2, ex1=(WORLD_W-ptx)/SX+W/2;
 g.fillStyle='#ffffff14';
 if(ex0>0&&ex0<W)g.fillRect(ex0,0,1,H);
 if(ex1>0&&ex1<W)g.fillRect(ex1,0,1,H);
 mark(P.x,P.y,'#fff',3);
 // depth ruler down the side, so "how far down am I" has an answer on the map itself
 g.font='7px monospace';g.textAlign='left';
 for(let d=0;d<=WORLD_H;d+=400){const my=(d-pty)/SY+H/2;
  if(my<8||my>H-2)continue;
  g.fillStyle='#ffffff18';g.fillRect(0,my,W,1);
  g.fillStyle='#8a8578';g.fillText(Math.max(0,d-SURFACE)+'m',2,my-2)}
 openPanel(`<h2>MAP</h2>
  <div class="sub">${biomeName(Math.floor(P.y/TILE)).toUpperCase()} · ${Math.max(0,Math.floor(P.y/TILE)-SURFACE)}m
  ${auraHas('prospector')?' · Prospector active':''}</div>
  <div class="mapwrap"><img src="${c.toDataURL()}" class="bigmap"></div>
  <div class="sub"><span style="color:#d8a53f">◆</span> chest &nbsp;
   <span style="color:#ffe9a0">◆</span> shrine &nbsp;
   <span style="color:#e05555">◆</span> boss &nbsp;
   <span style="color:#3fc9c1">◆</span> anchor</div>
  <button onclick="backPanel()">CLOSE <span class="sub">${pr('cancel')}</span></button>`,false,openMap)}

   <span class="sub"><br>${C.d}<br>${fxs}</span></button>`}
 h+=`<button onclick="toggleKit()">STARTING GEAR: ${META.useClassKit!==false?'class kit':'custom loadout'}</button>`;
 h+='<button onclick="openCamp()">BACK</button>';openPanel(h)}
// classFx() is read live by inc(), so switching class changes every stat immediately — not
// just on the next run. Without this the cached ATK, maxHP and armor all go stale the moment
// you pick a class and walk away from camp without descending.
function applyClass(){discover('cls',META.cls,true);
 refreshAttacks();P.maxhp=maxHP();P.hp=Math.min(P.hp,P.maxhp);P.fuel=Math.min(P.fuel,P.maxfuel)}
function pickClass(id){if(META.classes[id]){META.cls=id;discover('cls',id,true);saveMeta();applyClass();toast(CLASSES[id].n)}openClasses()}
function buyClass(id){const C=CLASSES[id];
 if(!META.classes[id]&&META.shards>=C.cost){META.shards-=C.cost;META.classes[id]=1;META.cls=id;saveMeta();applyClass();sfx('level');toast('Unlocked '+C.n)}
 openClasses()}
function toggleKit(){META.useClassKit=(META.useClassKit===false);saveMeta();openClasses()}
function openAnchors(){
 let h='<h2>DESCEND FROM</h2><div class="sub">Anchors set themselves the first time you reach a biome.</div>';
 for(const b of BIOMES){const n=b[1];
  if(META.anchors[n])h+=`<button onclick="setAnchor('${n}')">${META.startBiome===n?'▸ ':''}${n.toUpperCase()} <span class="sub">~${Math.max(0,biomeTop(n)-SURFACE)}m</span></button>`;
  else h+=`<button disabled>${n.toUpperCase()} <span class="sub">— not yet reached</span></button>`}
 h+='<div class="sub">Deeper starts mean harder enemies immediately. No shard cost.</div>';
 h+='<button onclick="openCamp()">BACK</button>';openPanel(h)}
function setAnchor(n){if(META.anchors[n]){META.startBiome=n;saveMeta()}openAnchors()}
function openLoadout(){
 let h='<h2>STARTING LOADOUT</h2><div class="sub">Applies next run. Shields may take either hand.</div>';
 for(const sl of ['melee','ranged','armor']){
  h+=`<div class="sub" style="margin-top:6px">${sl.toUpperCase()} SLOT</div>`;
  h+=`<button onclick="setLoad('${sl}',null)">${META.loadout[sl]?'':'▸ '}(empty)</button>`;
  for(const id of gearPool()){const b=GEAR[id];
   if(b.slot!==sl&&b.slot!=='any')continue;
   if(b.slot==='any'&&sl==='armor')continue;
   h+=`<button onclick="setLoad('${sl}','${id}')">${META.loadout[sl]===id?'▸ ':''}${b.n} <span class="sub">${b.sockets} socket(s)</span></button>`}}
 h+='<button onclick="openCamp()">BACK</button>';openPanel(h)}
function setLoad(slot,id){META.loadout[slot]=id;saveMeta();openLoadout()}
function openThreat(){
 let h=`<h2>THREAT</h2><div class="sub">Each biome boss you fell raises the ceiling by one tier.
  Higher threat pays more shards and better loot.</div>`;
 THREATS.forEach((t,i)=>{
  const ok=i<=(META.maxThreat||0);
  h+=`<button ${ok?'':'disabled'} onclick="setThreat(${i})">
   ${META.threat===i?'▸ ':''}${t.n} <span class="sub">— ${ok?t.d:'kill '+t.req+' distinct minibosses'}
   <br>${Math.round(t.shard*100)}% shards · ${Math.round(t.rare*100)}% rarity</span></button>`});
 h+=`<button onclick="openCamp()">BACK <span class="sub">${pr('cancel')}</span></button>`;
 openPanel(h)}
function setThreat(i){if(i<=(META.maxThreat||0)){META.threat=i;saveMeta();sfx('level')}openThreat()}
function toggleAudio(){AUDIO_ON=!AUDIO_ON;META.audio=AUDIO_ON?1:0;saveMeta();if(AUDIO_ON){audioInit();sfx('pick')}openCamp()}
// THE VAULT (DESIGN-PLAN §3.5). Dead Cells' real hook is that death is a scene change, not a
// reset. Three slots; deposit costs shards scaled by rarity so a great early unique becomes an
// event you can bank rather than a thing you lose in four minutes.
const VAULT_COST=[60,140,300,650];
function openVault(){
 let h=`<h2>THE VAULT</h2><div class="sub">Stored items come back on every future run. Shards: ${META.shards}◆</div>`;
 if(!META.vault.length)h+='<div class="sub">empty</div>';
 META.vault.forEach((v,i)=>{h+=`<button onclick="vaultTake(${i})"><span class="r${v.rarity}">${itemName(v)}</span>
   <span class="sub">${itemDesc(v)||affixStr(v)} — tap to remove</span></button>`});
 const carried=[];
 for(const sl of ['melee','ranged','armor'])if(EQ[sl])carried.push({from:sl,item:EQ[sl]});
 BAG.forEach((b,i)=>{if(b.kind==='gear')carried.push({bag:i,item:b.item})});
 h+='<div class="sub" style="margin-top:8px">Deposit from this run:</div>';
 if(META.vault.length>=3)h+='<div class="sub">Vault full — remove something first.</div>';
 else if(!carried.length)h+='<div class="sub">nothing carried</div>';
 else carried.forEach((c,i)=>{const cost=VAULT_COST[c.item.rarity]||100;
  // An item that CAME from the vault cannot go back in — otherwise every run mints another
  // permanent copy of it for shards, which is unlimited item duplication.
  if(c.item.fromVault){h+=`<button disabled><span class="r${c.item.rarity}">${itemName(c.item)}</span>
   <span class="sub">already stored in the vault</span></button>`;return}
  h+=`<button ${META.shards<cost?'disabled':''} onclick="vaultPut(${i})">
   <span class="r${c.item.rarity}">${itemName(c.item)}</span>
   <span class="sub">${c.from?'equipped '+c.from:'in bag'} — ${cost}◆</span></button>`});
 h+='<button onclick="openCamp()">BACK</button>';
 VAULT_SRC=carried;openPanel(h)}
let VAULT_SRC=[];
function vaultPut(i){const c=VAULT_SRC[i];if(!c||META.vault.length>=3)return;
 if(c.item.fromVault)return;   // see openVault: re-depositing would duplicate the item
 const cost=VAULT_COST[c.item.rarity]||100;
 if(META.shards<cost)return;
 META.shards-=cost;META.vault.push(c.item);
 if(c.from){EQ[c.from]=null;refreshAttacks();P.maxhp=maxHP();P.hp=Math.min(P.hp,P.maxhp)}
 else BAG.splice(c.bag,1);
 saveMeta();sfx('level');toast('Vaulted: '+itemName(c.item));openVault()}
function vaultTake(i){const v=META.vault[i];if(!v)return;
 META.vault.splice(i,1);saveMeta();
 delete v.fromVault;   // no longer stored, so it may be deposited again later
 BAG.push({kind:'gear',item:v});toast('Withdrawn to bag');openVault()}
function buyUnlock(id){const u=UNLOCKS.find(x=>x.id===id);if(META.shards>=u.cost&&!META.unlocks[id]){META.shards-=u.cost;META.unlocks[id]=1;saveMeta();toast('Unlocked: '+u.n)}openCamp()}
function buyNode(id){const n=TREE.find(x=>x.id===id);if(META.shards>=n.cost&&!META.tree[id]){META.shards-=n.cost;META.tree[id]=1;saveMeta();P.maxhp=maxHP();refreshAttacks();toast(n.n)}openCamp()}
// The canvas is grabbed here rather than in RENDER because the mouse listeners below need it,
// and a `const` declared further down would be in the temporal dead zone at this point.
const cv=$('cv'),ctx=cv.getContext('2d');

// ============ INPUT ============
// One abstract input state that the sim reads; every device writes into it. Adding a device
// means adding a poller, not touching gameplay. The game was born one-thumb mobile, so touch
// keeps auto-aim; a mouse or a right stick is precise enough to aim manually.
//
//   INMODE tracks the LAST device you actually used, and the whole UI follows it — button
//   prompts, the touch overlay, and whether a crosshair is drawn.
let INMODE='kb', PADTYPE='xbox', padIndex=-1;
const IN={x:0,tx:0,aimX:1,aimY:0,manual:false};
const HELD={mel:false,rng:false,jmp:false};
const KEYS={};
// Edge-triggered actions. Held state lives in HELD; one-shot presses go through EDGE so a
// gamepad button and a key can fire the same action without either double-firing.
const EDGE={dodge:0,abil:0,bag:0,camp:0,map:0,pause:0,confirm:0,cancel:0,navU:0,navD:0,navL:0,navR:0};
function fire(a){EDGE[a]=1}
function consumed(a){const v=EDGE[a];EDGE[a]=0;return v}

// ---- settings, persisted in META.set ----
const SET_DEF={vol:22,shake:100,hitstop:100,flashes:100,dmgnum:1,aimassist:55,autoaim:1,deadzone:22,rumble:1,hints:1};
let SET=Object.assign({},SET_DEF);
function loadSet(){SET=Object.assign({},SET_DEF,META.set||{});
 // prefers-reduced-motion is free in one HTML file and it is the difference between playable
 // and unplayable for some people. Honoured ONCE, on a save that has never set these, so it
 // is a default rather than an override the player cannot escape.
 try{if(!META.set&&matchMedia('(prefers-reduced-motion: reduce)').matches){
  SET.shake=0;SET.flashes=25;SET.hitstop=40}}catch(e){}
 applyVol()}
function saveSet(){META.set=SET;saveMeta()}
function applyVol(){if(MASTER)MASTER.gain.value=(SET.vol/100)*0.9}

function setMode(m){if(INMODE===m)return;
 // Whatever was held on the old device is not held on the new one. Without this, unplugging a
 // pad mid-swing leaves the attack button stuck down for the rest of the run.
 HELD.mel=HELD.rng=HELD.jmp=false;IN.tx=0;IN.padX=0;
 INMODE=m;
 document.body.classList.toggle('touchmode',m==='touch');
 refreshPrompts()}

// ---- keyboard ----
// Codes, not characters, so the layout survives non-QWERTY.
const KEYMAP={
 // Directions are resolved into an axis, never shown as prompts — `move` is the label that
 // stands for all four, and it is the one GLYPH carries.
 left:['KeyA','ArrowLeft'], right:['KeyD','ArrowRight'], up:['KeyW','ArrowUp'], down:['KeyS','ArrowDown'],
 jump:['Space','KeyW','ArrowUp'], mel:['KeyJ','KeyZ'], rng:['KeyK','KeyX'],
 dodge:['ShiftLeft','ShiftRight','KeyL'], abil:['KeyF','KeyQ'],
 bag:['KeyE','KeyI','Tab'], camp:['KeyC'], map:['KeyM'], pause:['Escape','KeyP'],
};
const heldKey=a=>KEYMAP[a].some(c=>KEYS[c]);
addEventListener('keydown',e=>{
 if(e.code==='Tab')e.preventDefault();
 setMode('kb');
 if(e.repeat)return;
 KEYS[e.code]=true;
 if(KEYMAP.jump.includes(e.code)&&!paused){P.jbuf=0.12;HELD.jmp=true}
 if(KEYMAP.mel.includes(e.code))HELD.mel=true;
 if(KEYMAP.rng.includes(e.code))HELD.rng=true;
 if(KEYMAP.dodge.includes(e.code))fire('dodge');
 if(KEYMAP.abil.includes(e.code))fire('abil');
 if(KEYMAP.bag.includes(e.code))fire('bag');
 if(KEYMAP.camp.includes(e.code))fire('camp');
 if(KEYMAP.map.includes(e.code))fire('map');
 if(KEYMAP.pause.includes(e.code))fire('pause');
 if(e.code==='Enter')fire('confirm');
 if(e.code==='ArrowUp'||e.code==='KeyW')fire('navU');
 if(e.code==='ArrowDown'||e.code==='KeyS')fire('navD');
 if(e.code==='ArrowLeft')fire('navL');
 if(e.code==='ArrowRight')fire('navR')});
addEventListener('keyup',e=>{KEYS[e.code]=false;
 if(KEYMAP.jump.includes(e.code))HELD.jmp=false;
 if(KEYMAP.mel.includes(e.code))HELD.mel=false;
 if(KEYMAP.rng.includes(e.code))HELD.rng=false});
addEventListener('blur',()=>{for(const k in KEYS)KEYS[k]=false;HELD.mel=HELD.rng=HELD.jmp=false});
function kbAxis(){let x=0;if(heldKey('left'))x-=1;if(heldKey('right'))x+=1;return x}

// ---- mouse: aim at the cursor, left click swings, right click shoots ----
let mouseX=0,mouseY=0,mouseIn=false;
function screenToWorld(sx,sy){
 const r=cv.getBoundingClientRect();
 // camOX/camOY carry the per-frame screenshake offset. Aiming through them makes the cursor's
 // world position jitter with the shake — worst exactly when you are being hit.
 const ox=Math.round(cam.x-VW/2), oy=Math.round(cam.y-VH/2);
 return {x:ox+(sx-r.left)/Math.max(1,r.width)*VW, y:oy+(sy-r.top)/Math.max(1,r.height)*VH}}
// Pointer events filtered on pointerType. A touch also emits synthetic mouse events, and
// treating those as "a mouse appeared" deleted the touch UI out from under a phone player on
// their very first tap.
const isMouse=e=>!e.pointerType||e.pointerType==='mouse';
cv.addEventListener('pointermove',e=>{if(!isMouse(e))return;
 mouseX=e.clientX;mouseY=e.clientY;mouseIn=true;setMode('kb')});
cv.addEventListener('pointerleave',e=>{if(isMouse(e))mouseIn=false});
cv.addEventListener('pointerdown',e=>{if(!isMouse(e))return;setMode('kb');
 if(e.button===0)HELD.mel=true;else if(e.button===2)HELD.rng=true;else if(e.button===1)fire('dodge')});
addEventListener('pointerup',e=>{if(!isMouse(e))return;
 if(e.button===0)HELD.mel=false;else if(e.button===2)HELD.rng=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault()},{passive:false});

// ---- gamepad ----
// Standard mapping. Face-button labels differ between Xbox and PlayStation pads, so the id is
// sniffed once and every on-screen prompt reads from GLYPH.
const PAD={A:0,B:1,X:2,Y:3,LB:4,RB:5,LT:6,RT:7,BACK:8,START:9,L3:10,R3:11,UP:12,DOWN:13,LEFT:14,RIGHT:15};
let padPrev=[];
addEventListener('gamepadconnected',e=>{
 padIndex=e.gamepad.index;
 const id=(e.gamepad.id||'').toLowerCase();
 PADTYPE=/dualshock|dualsense|playstation|sony|054c/.test(id)?'ps':'xbox';
 setMode('pad');toast('Controller connected');refreshPrompts()});
addEventListener('gamepaddisconnected',e=>{if(e.gamepad.index===padIndex){
 padIndex=-1;padPrev=[];HELD.mel=HELD.rng=HELD.jmp=false;
 setMode('kb');toast('Controller disconnected')}});
function dz(v){const d=SET.deadzone/100;return Math.abs(v)<d?0:(v-Math.sign(v)*d)/(1-d)}
function pollPad(){
 if(!navigator.getGamepads)return;
 const pads=navigator.getGamepads();
 let gp=padIndex>=0?pads[padIndex]:null;
 if(!gp)for(const p of pads)if(p&&p.connected){gp=p;padIndex=p.index;break}
 if(!gp)return;
 const b=gp.buttons,ax=gp.axes;
 const down=i=>!!(b[i]&&(b[i].pressed||b[i].value>0.5));
 // any activity at all switches the UI over to controller prompts
 let active=false;
 for(let i=0;i<b.length;i++)if(down(i))active=true;
 const lx=dz(ax[0]||0),ly=dz(ax[1]||0),rx=dz(ax[2]||0),ry=dz(ax[3]||0);
 if(Math.abs(lx)>0.02||Math.abs(ly)>0.02||Math.abs(rx)>0.02||Math.abs(ry)>0.02)active=true;
 if(active)setMode('pad');
 if(INMODE!=='pad')return;
 // movement: analog left stick, with the dpad as a digital fallback
 IN.padX=lx||(down(PAD.LEFT)?-1:down(PAD.RIGHT)?1:0);
 // aim: right stick, absolute direction
 if(Math.hypot(rx,ry)>0.35){IN.aimX=rx;IN.aimY=ry;IN.manual=true;IN.manualT=perf}
 HELD.jmp=down(PAD.A)||down(PAD.LB);
 HELD.mel=down(PAD.X)||down(PAD.RB);
 HELD.rng=down(PAD.RT)||down(PAD.Y);
 // Snapshot every edge ONCE. Reading through a function that also advanced padPrev meant the
 // second read of a button was always false — A fired 'confirm' and then failed to buffer a
 // jump, and B fired 'dodge' and then never fired 'cancel', leaving a controller with no way
 // to back out of any menu.
 const ed=[];
 for(let i=0;i<b.length;i++){const now=down(i);ed[i]=now&&!padPrev[i];padPrev[i]=now}
 const edge=i=>!!ed[i];
 // A face button means one thing in a menu and another in the world, so the mapping depends
 // on whether the game is paused.
 if(paused){
  if(edge(PAD.A))fire('confirm');
  if(edge(PAD.B))fire('cancel');
  if(edge(PAD.START))fire('pause');
  navRepeat-=DT;
  if(Math.abs(ly)>0.6&&navRepeat<=0){fire(ly<0?'navU':'navD');navRepeat=0.18}
  else if(Math.abs(ly)<=0.6)navRepeat=0}
 else{
  if(edge(PAD.B))fire('dodge');
  if(edge(PAD.LT))fire('abil');
  if(edge(PAD.BACK))fire('bag');
  if(edge(PAD.START))fire('pause');
  if(edge(PAD.L3))fire('map');
  if(edge(PAD.R3))fire('camp');
  if(edge(PAD.A)||edge(PAD.LB))P.jbuf=0.12}
 if(edge(PAD.UP))fire('navU');
 if(edge(PAD.DOWN))fire('navD');
 if(edge(PAD.LEFT))fire('navL');
 if(edge(PAD.RIGHT))fire('navR')}
let navRepeat=0,lastMapT=0;
function rumble(strong,weak,ms){
 if(!SET.rumble||INMODE!=='pad'||!navigator.getGamepads)return;
 const gp=navigator.getGamepads()[padIndex];
 if(gp&&gp.vibrationActuator&&gp.vibrationActuator.playEffect)
  gp.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:weak}).catch(()=>{})}

// ---- touch ----
let stickId=null,stickOx=0,stickOy=0;
const sz=$('stickzone'),stEl=$('stick'),nub=$('nub');
sz.addEventListener('pointerdown',e=>{setMode('touch');stickId=e.pointerId;stickOx=e.clientX;stickOy=e.clientY;
 stEl.style.display='block';stEl.style.left=(e.clientX-45)+'px';stEl.style.top=(e.clientY-45)+'px';
 sz.setPointerCapture(e.pointerId)});
sz.addEventListener('pointermove',e=>{if(e.pointerId!==stickId)return;
 const dx=Math.max(-40,Math.min(40,e.clientX-stickOx));
 nub.style.left=(25+dx)+'px';IN.tx=Math.abs(dx)<6?0:dx/40});
sz.addEventListener('pointerup',e=>{if(e.pointerId===stickId){stickId=null;IN.tx=0;stEl.style.display='none';nub.style.left='25px'}});
sz.addEventListener('pointercancel',()=>{stickId=null;IN.tx=0;stEl.style.display='none'});
function bindBtn(id,down,up){const el=$(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();setMode('touch');down()});
 if(up){el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up);el.addEventListener('pointercancel',up)}}
bindBtn('bJump',()=>{P.jbuf=0.12;HELD.jmp=true},()=>HELD.jmp=false);
bindBtn('bMel',()=>HELD.mel=true,()=>HELD.mel=false);
bindBtn('bRng',()=>HELD.rng=true,()=>HELD.rng=false);
bindBtn('bDodge',()=>fire('dodge'));
bindBtn('bAbil',()=>fire('abil'));
$('bagBtn').addEventListener('click',()=>fire('bag'));
$('mapBtn').addEventListener('click',()=>fire('map'));
$('campBtn').addEventListener('click',()=>fire('camp'));
$('pauseBtn').addEventListener('click',()=>fire('pause'));

// ---- audio arming ----
// A browser refuses to start an AudioContext outside a user gesture, so the context cannot be
// built at load. The input rewrite dropped this handler and the game shipped completely silent
// — every sfx() call ran, found AC null, and returned. One listener, removed after it fires.
function armAudio(){
 if(AUDIO_ON)audioInit();
 if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
 removeEventListener('pointerdown',armAudio,true);
 removeEventListener('keydown',armAudio,true);
 removeEventListener('touchstart',armAudio,true)}
addEventListener('pointerdown',armAudio,true);
addEventListener('keydown',armAudio,true);
addEventListener('touchstart',armAudio,true);

// ---- per-frame input resolution ----
// Runs before the sim. Everything above only records intent; this is where intent becomes
// game actions, so pause rules and menu focus are enforced in exactly one place.
function readInput(){
 pollPad();
 // movement, by device
 if(INMODE==='pad')IN.x=IN.padX||0;
 else if(INMODE==='touch')IN.x=IN.tx||0;
 else IN.x=kbAxis();
 // aim
 if(INMODE==='kb'&&mouseIn){
  const w=screenToWorld(mouseX,mouseY);
  const dx=w.x-P.x,dy=w.y-P.y,d=Math.hypot(dx,dy);
  if(d>4){IN.aimX=dx/d;IN.aimY=dy/d;IN.manual=true;IN.manualT=perf}}
 // a stick released or a mouse that left the canvas falls back to auto-aim after a beat
 if(IN.manual&&perf-(IN.manualT||0)>1.5)IN.manual=false;
 if(paused){menuInput();return}
 if(consumed('dodge'))dodge();
 if(consumed('abil'))useAbility();
 if(consumed('bag'))openBag();
 if(consumed('camp')){if(nearCamp())openCamp();else toast('Not at camp')}
 // First press toggles the corner map, a second press within a beat opens the full one —
 // one binding, two intents, no extra button to find on a controller.
 if(consumed('map')){
  if(perf-(lastMapT||0)<0.45){MMON=true;openMap()}
  else{MMON=!MMON;toast('Minimap '+(MMON?'on':'off')+' — press again for the full map')}
  lastMapT=perf}
 if(consumed('pause'))openPause();
 consumed('confirm');consumed('cancel');consumed('navU');consumed('navD');consumed('navL');consumed('navR')}

// ---- menu navigation ----
// Every panel is a stack of <button>s, so one focus cursor over the enabled ones makes the
// entire UI controller-navigable without any per-screen work.
let menuIdx=0;
function menuButtons(){return Array.from($('panel').querySelectorAll('button:not([disabled])'))}
function menuFocus(i){const b=menuButtons();if(!b.length)return;
 menuIdx=(i+b.length)%b.length;
 b.forEach((el,k)=>el.classList.toggle('foc',k===menuIdx));
 const el=b[menuIdx];if(el.scrollIntoView)el.scrollIntoView({block:'nearest'})}
function menuInput(){
 if(consumed('navU'))menuFocus(menuIdx-1);
 if(consumed('navD'))menuFocus(menuIdx+1);
 consumed('navL');consumed('navR');
 const go=consumed('confirm'),back=consumed('cancel'),esc=consumed('pause');
 // Drain EVERY gameplay action before acting. Returning early left them queued, so a key
 // pressed while a menu was open fired the moment the menu closed.
 consumed('dodge');consumed('abil');consumed('bag');consumed('camp');consumed('map');
 if(go){const b=menuButtons()[menuIdx];if(b)b.click();return}
 // A modal panel demands a real choice; everything else backs out to wherever it came from.
 if((back||esc)&&!MODAL)backPanel()}

// ---- device-aware prompts ----
// The same action is SPACE, A or ✕ depending on what you last touched. Every label in the UI
// goes through pr() so nothing ever tells a controller player to press E.
const GLYPH={
 // mel/rng carry the key alternates: a touchpad has no comfortable RMB and no MMB at all,
 // and nothing else ever tells that player the keys exist.
 kb:   {jump:'SPACE',mel:'LMB/J',rng:'RMB/K',dodge:'SHIFT',abil:'F',bag:'E',camp:'C',map:'M',pause:'ESC',confirm:'ENTER',cancel:'ESC',move:'WASD',aim:'MOUSE'},
 xbox: {jump:'A',mel:'X',rng:'RT',dodge:'B',abil:'LT',bag:'BACK',camp:'R3',map:'L3',pause:'START',confirm:'A',cancel:'B',move:'L-STICK',aim:'R-STICK'},
 ps:   {jump:'✕',mel:'□',rng:'R2',dodge:'○',abil:'L2',bag:'SHARE',camp:'R3',map:'L3',pause:'OPTIONS',confirm:'✕',cancel:'○',move:'L-STICK',aim:'R-STICK'},

// 17 tiles across is the compromise: enough warning to react, still chunky enough to read.
let CAMTILES=17;
function resize(){

addEventListener('resize',resize);resize();
const cam={x:0,y:0};

// ---- ART FALLBACK LAYER (DESIGN-PLAN §8) ----
// Everything visual goes through drawEntity(). With no atlas loaded it draws the flat rects
// the game shipped with; drop in a sprite sheet later and nothing else has to change, so the
// "single file, no build step, works offline" property survives an art pass.
// Everything visual goes through here. A baked sprite blits at its own pixel size, centred on
// the entity and sitting ON the given box rather than being squashed into it — a sprite scaled
// to a hitbox stops being pixel art. Anything without a sprite falls back to the flat quad, so
// the game renders correctly with a half-finished roster.

function drawEntity(g,kind,x,y,w,h,col,face,frame){

  const px=Math.round(x), dy=Math.round(y+h/2-c.height), dx=px-(c.width>>1);
  // translate(2x) + scale(-1,1) mirrors about x, so the sprite flips IN PLACE rather than

const TINTED={};
function tintedSprite(kind,fr,col){

let MM=null,mmT=0,MMON=true;

 for(const ch of CHESTS)if(!ch.opened)mark(ch.x,ch.y,'#d8a53f',2);
 for(const sh of SHRINES)if(!sh.used)mark(sh.x,sh.y,'#ffe9a0',2);

   const par=L?0.30:0.15, amp=L?22:13, step=L?30:46;

   const bx=ox*par;

  if(Math.hypot(sh.x-P.x,sh.y-P.y)<20){openShrine(sh);break}}
 tickBuffs();
 if(GRAPPLE){GRAPPLE.t-=dt;if(GRAPPLE.t<=0)GRAPPLE=null}
 if(perf-lastSweep>2){lastSweep=perf;sweepChunks();
  // UNSTABLE (dissonance >= 70): distant chunks re-form. Never near the player — dissolving
  // the floor underfoot is a bug, not a mechanic.
  const churn=dissChurn();

   const pcx=Math.floor(P.x/TILE/CHUNK),pcy=Math.floor(P.y/TILE/CHUNK);

 for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;if(p.t<=0)PART.splice(i,1)}
